<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aktivita">
<title>Aktivita</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="lib/leaflet.css">
<script src="lib/leaflet.js" defer></script>
<style>
:root{
  --bg:#000; --card:#1c1c1e; --card2:#2c2c2e; --line:#38383a;
  --text:#fff; --muted:#8e8e93; --muted2:#636366;
  --move:#fa114f; --move2:#ff4f86; --ex:#92e82a; --ex2:#c4ff3d; --st:#1eeaef; --st2:#62fff6;
  --orange:#ff6a1a; --blue:#0a84ff; --yellow:#ffd60a; --purple:#bf5af2;
  --r:18px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.app{max-width:560px;margin:0 auto;padding:calc(var(--safe-t) + 8px) 16px calc(var(--safe-b) + 96px)}
.view{display:none;animation:fade .25s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h1{font-size:32px;font-weight:800;margin:6px 0 2px;letter-spacing:-.5px}
h2{font-size:22px;font-weight:700;margin:26px 0 10px}
h3{font-size:17px;font-weight:600;margin:0 0 6px}
.sub{color:var(--muted);font-size:15px}
.small{font-size:13px;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:12px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--card2);font-size:13px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:14px;background:var(--card2);font-weight:600;font-size:15px}
.btn.primary{background:var(--ex);color:#000}
.btn.danger{background:#3a0f16;color:#ff6b81}
.btn.block{width:100%}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.iconbtn{width:40px;height:40px;border-radius:50%;background:var(--card2);display:inline-flex;align-items:center;justify-content:center;font-size:18px}
/* header & week strip */
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 0 4px;text-align:center}
.week .d{display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 0;border-radius:12px}
.week .lbl{font-size:13px;font-weight:600;color:#ddd;width:24px;height:24px;line-height:24px;border-radius:50%}
.week .d.sel .lbl{background:var(--muted2);color:#fff}
.week .d.today .lbl{color:var(--move)}
.week .d.sel.today .lbl{background:var(--move);color:#fff}
.weeknav{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
/* big rings */
.ringwrap{display:flex;justify-content:center;margin:14px 0 4px}
.ringwrap svg{width:min(78vw,310px);height:auto;overflow:visible}
.ring-anim{transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.metric{padding:2px 0 14px;border-bottom:1px solid #1f1f22;margin-bottom:14px}
.metric:last-child{border:0;margin:0}
.metric .t{font-size:17px;font-weight:600}
.metric .v{font-size:34px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.metric .v small{font-size:22px;font-weight:700}
.c-move{color:var(--move)} .c-ex{color:var(--ex)} .c-st{color:var(--st)} .c-or{color:var(--orange)} .c-bl{color:var(--blue)} .c-mu{color:var(--muted)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:16px 12px}
.kv .k{font-size:15px;color:#ddd}
.kv .v{font-size:30px;font-weight:600;color:#c7c7cc;font-variant-numeric:tabular-nums}
.kv .v small{font-size:18px}
.badge-est{font-size:11px;color:var(--yellow);border:1px solid #5a4a00;border-radius:6px;padding:1px 5px;margin-left:6px;vertical-align:middle}
/* segmented */
.seg{display:flex;background:var(--card);border-radius:12px;padding:3px;margin:12px 0}
.seg button{flex:1;padding:8px 0;border-radius:9px;font-weight:600;font-size:14px;color:#ddd}
.seg button.on{background:var(--card2);color:#fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 12px;border-radius:999px;background:var(--card);font-size:13px;font-weight:600;color:var(--muted)}
.chip.on{background:#fff;color:#000}
.bigstat .lab{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
.bigstat .num{font-size:40px;font-weight:700;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.bigstat .num small{font-size:18px;color:var(--muted);font-weight:600}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px}
.delta{font-weight:700;font-size:13px}
.up{color:var(--ex)} .down{color:#ff6b81}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.statgrid .card{margin:0;padding:12px 14px}
.statgrid .l{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase}
.statgrid .n{font-size:22px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
/* insight cards */
.insight{background:var(--card);border-radius:var(--r);padding:16px;margin:12px 0}
.insight .tag{font-weight:600;font-size:15px;display:flex;align-items:center;gap:6px}
.insight p{font-size:17px;font-weight:600;line-height:1.3;margin:8px 0 10px}
.hbar{height:30px;border-radius:7px;display:flex;align-items:center;padding:0 10px;font-weight:700;font-size:15px;margin-top:4px}
/* list items */
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #222}
.item:last-child{border:0}
.item .ic{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.item .main{flex:1;min-width:0}
.item .ttl{font-weight:600}
.item .meta{font-size:13px;color:var(--muted)}
.item .right{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
/* timeline strip */
.strip{position:relative;height:34px;background:#141416;border-radius:8px;overflow:hidden;margin-top:8px}
.strip .seg2{position:absolute;top:5px;bottom:5px;border-radius:5px;min-width:3px}
.strip-axis{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}
/* tracker */
.tracker{text-align:center}
.tracker .time{font-size:56px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-1px;margin:6px 0}
.tracker .tg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 16px}
.tracker .tg .n{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.startbtn{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#b6ff5a,#5fc219);color:#000;font-size:22px;font-weight:800;box-shadow:0 0 0 8px rgba(146,232,42,.15),0 0 40px rgba(146,232,42,.35);margin:18px auto;display:flex;align-items:center;justify-content:center;flex-direction:column}
.map{height:260px;border-radius:14px;overflow:hidden;background:#111;margin:10px 0}
.leaflet-container{background:#111}
.leaflet-bar a,.leaflet-bar a:hover{background:#2c2c2e;color:#fff;border-color:#3a3a3c}
.warn{background:#2a2100;color:#ffd60a;border-radius:12px;padding:10px 12px;font-size:13px;margin:10px 0}
.ok{background:#0f2a12;color:#7dff8c;border-radius:12px;padding:10px 12px;font-size:13px;margin:10px 0}
/* badges */
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 8px;text-align:center}
.medal{width:78px;height:78px;margin:0 auto 6px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:34px;position:relative}
.medal.on{background:radial-gradient(circle at 35% 30%,#ffe9a6,#e0a32e 55%,#8a5a12);box-shadow:0 0 18px rgba(255,190,60,.35),inset 0 -4px 8px rgba(0,0,0,.3)}
.medal.off{background:#1c1c1e;filter:grayscale(1);opacity:.45;border:2px dashed #3a3a3c}
.medal .cnt{position:absolute;bottom:-4px;right:-2px;background:var(--move);color:#fff;font-size:11px;font-weight:800;border-radius:999px;padding:2px 6px}
.bname{font-size:12px;font-weight:600;line-height:1.2}
.bdesc{font-size:11px;color:var(--muted);line-height:1.2;margin-top:2px}
.progress{height:10px;background:#2c2c2e;border-radius:99px;overflow:hidden;margin:8px 0 4px}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--st),var(--ex));border-radius:99px}
/* heatmap */
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:2px;overflow-x:auto;padding-bottom:4px}
.heat i{width:9px;height:9px;border-radius:2px;background:#1a1a1c;display:block}
/* tab bar */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--safe-b) + 10px);width:min(94vw,520px);display:flex;justify-content:space-around;background:rgba(40,40,42,.72);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);border:1px solid rgba(255,255,255,.08);border-radius:30px;padding:6px;z-index:1000}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:24px;font-size:11px;font-weight:600;color:#d0d0d4}
.tabbar button svg{width:24px;height:24px}
.tabbar button.on{background:rgba(0,0,0,.55);color:var(--ex)}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:2000;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.show{display:flex}
.sheet{background:#121214;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(var(--safe-b) + 20px);animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;background:#3a3a3c;border-radius:9px;margin:0 auto 12px}
.field{margin:10px 0}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
code,.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;background:#0d0d0f;border:1px solid #2a2a2c;border-radius:10px;padding:10px;display:block;white-space:pre-wrap;word-break:break-all;color:#cfe}
.toast{position:fixed;top:calc(var(--safe-t) + 12px);left:50%;transform:translateX(-50%);background:#2c2c2e;padding:10px 16px;border-radius:14px;font-size:14px;font-weight:600;z-index:3000;box-shadow:0 8px 30px rgba(0,0,0,.5);display:none}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.syncdot{width:8px;height:8px;border-radius:50%;background:var(--muted2);display:inline-block}
.syncdot.on{background:var(--ex)} .syncdot.err{background:#ff453a}
</style>
</head>
<body>
<div class="app">

  <!-- ========== SOUHRN ========== -->
  <section class="view active" id="v-today">
    <div class="topbar">
      <div>
        <div class="sub" id="todaySub">—</div>
        <h1 id="todayTitle" style="font-size:28px">Souhrn</h1>
      </div>
      <div class="row">
        <button class="iconbtn" id="btnSync" title="Synchronizovat"><span class="syncdot" id="syncDot"></span></button>
        <button class="iconbtn" id="btnPickDate" title="Vybrat datum">📅</button>
        <input type="date" id="datePicker" style="position:absolute;opacity:0;width:1px;height:1px;pointer-events:none">
      </div>
    </div>
    <div class="weeknav"><button class="btn sm" id="wkPrev">‹ týden</button><span class="small" id="wkLabel"></span><button class="btn sm" id="wkNext">týden ›</button></div>
    <div class="week" id="weekStrip"></div>
    <div class="ringwrap" id="bigRing"></div>
    <div class="card" id="dayMetrics"></div>
    <div class="card" id="dayMore"></div>
    <div class="card" id="dayStripCard"></div>
    <div id="dayLists"></div>
    <h2>Důležité informace</h2>
    <div id="insights"></div>
  </section>

  <!-- ========== STATISTIKY ========== -->
  <section class="view" id="v-stats">
    <h1>Statistiky</h1>
    <div class="seg" id="periodSeg">
      <button data-p="D">D</button><button data-p="W" class="on">T</button><button data-p="M">M</button><button data-p="6M">6 M</button><button data-p="Y">R</button>
    </div>
    <div class="chips" id="metricChips">
      <button class="chip on" data-m="steps">Kroky</button>
      <button class="chip" data-m="distM">Vzdálenost</button>
      <button class="chip" data-m="kcal">Pohyb</button>
      <button class="chip" data-m="exMin">Cvičení</button>
      <button class="chip" data-m="flights">Patra</button>
    </div>
    <div class="row between" style="margin-top:6px">
      <button class="iconbtn" id="perPrev">‹</button>
      <div class="sub" id="perLabel" style="text-align:center;flex:1"></div>
      <button class="iconbtn" id="perNext">›</button>
    </div>
    <div class="card" id="statMain"></div>
    <div class="statgrid" id="statGrid"></div>
    <div id="statExtra"></div>
  </section>

  <!-- ========== PROCHÁZKY ========== -->
  <section class="view" id="v-walk">
    <h1>Procházky</h1>
    <div class="card tracker" id="trackerCard"></div>
    <h2>Historie</h2>
    <div class="chips" id="walkFilter">
      <button class="chip on" data-f="all">Vše</button>
      <button class="chip" data-f="gps">GPS</button>
      <button class="chip" data-f="out">Odchody z domu</button>
      <button class="chip" data-f="tl">Časová osa</button>
    </div>
    <div class="card" id="walkList"></div>
  </section>

  <!-- ========== ÚSPĚCHY ========== -->
  <section class="view" id="v-awards">
    <h1>Úspěchy</h1>
    <div class="card" id="streakCard"></div>
    <h2>Virtuální výzva</h2>
    <div class="card" id="challengeCard"></div>
    <h2>Osobní rekordy</h2>
    <div class="card" id="recordsCard"></div>
    <h2>Odznaky</h2>
    <div class="card"><div class="badges" id="badgeGrid"></div></div>
  </section>

  <!-- ========== NASTAVENÍ ========== -->
  <section class="view" id="v-settings">
    <h1>Nastavení</h1>
    <div class="card" id="setGoals"></div>
    <div class="card" id="setFirebase"></div>
    <div class="card" id="setShortcut"></div>
    <div class="card" id="setData"></div>
    <p class="small" style="text-align:center">Aktivita PWA · verze <span id="ver"></span></p>
  </section>
</div>

<nav class="tabbar" id="tabbar">
  <button data-v="today" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6.3"/><circle cx="12" cy="12" r="2.6"/></svg>Souhrn</button>
  <button data-v="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 20V11M10 20V5M15 20v-7M20 20V8"/></svg>Statistiky</button>
  <button data-v="walk"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="13.5" cy="4" r="2.2"/><path d="M10.2 8.3l3-1.1c.9-.3 1.8.1 2.2.9l1.3 2.6 2.4 1.1-.7 1.6-3-1.3-.9-1.6-1 3.6 2.4 2.6V22h-1.8v-4.6l-2.6-2.4-1.1 3.6L7.2 22l-1.6-.9 3.2-4.6 1.7-6-1.6.7V14H7.1V10z"/></svg>Procházky</button>
  <button data-v="awards"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M12 15a6 6 0 100-12 6 6 0 000 12z"/><path d="M8.5 13.5L7 22l5-3 5 3-1.5-8.5"/></svg>Úspěchy</button>
  <button data-v="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 01-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 010-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 014 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 010 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>Nastavení</button>
</nav>

<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
